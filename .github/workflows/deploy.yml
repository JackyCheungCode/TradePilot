name: Deploy TradePilot

on:
  push:
    branches:
      - feature/lead-discovery-map-local-businesses

permissions:
  contents: read

concurrency:
  group: tradepilot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run lint
          npm run build

      - name: Configure Worker secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$GOOGLE_MAPS_API_KEY" || (echo "Missing GOOGLE_MAPS_API_KEY" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          printf '%s' "$GOOGLE_MAPS_API_KEY" | npx wrangler secret put GOOGLE_MAPS_API_KEY

      - name: Deploy Worker and Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: https://nlklnkkcwapwerkahoyb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_9jPg2Sv0VmMho3vOvxU00Q_-kWg8xw_
        run: |
          npm run build
          npx wrangler deploy
