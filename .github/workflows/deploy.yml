name: Deploy TradePilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradepilot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run lint
          npm run build

      - name: Deploy Worker and Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: https://nlklnkkcwapwerkahoyb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_9jPg2Sv0VmMho3vOvxU00Q_-kWg8xw_
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing bootstrap CLOUDFLARE_API_TOKEN" && exit 1)
          npm run build
          npx wrangler deploy
